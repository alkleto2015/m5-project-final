spring:
  liquibase:
    enabled: true
  cache:
    type: none
  init:
    mode: always
  datasource:
    # URL для H2 в режиме памяти с поддержкой синтаксиса PostgreSQL
    url: jdbc:h2:mem:jira-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Явно задаем диалект PostgreSQL для Hibernate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never





